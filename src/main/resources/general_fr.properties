### misc
summary.title.command=Résumé du bot
summary.title.thanks=Merci de m'avoir ajouté sur ce serveur !
summary.description=**__Description :__**\n\
  Démarre un appel d'un serveur Discord vers un autre avec la commande {0}. \
  Une fois l'appel commencé, tu peux discuter avec d'autres personnes sur un autre serveur Discord sans être dans le même salon vocal. \
  Ce bot utilise aussi des effets sonores pour le rendre encore plus réaliste.\n\
  Il est aussi possible d'utiliser la commande {1} pour démarrer un appel avec un serveur Discord aléatoire inscrit dans les [pages jaunes]({8}).\n\n\
  La langue de ce bot dépend de la langue principale du serveur. Si le serveur Discord n'est pas un serveur communautaire, le bot utilisera l'anglais par défaut.\n\n\
  **__Commandes :__**\n\
  `{2}` - Démarre un appel avec un serveur Discord en utilisant son numéro de téléphone (ID du serveur)\n\
  `{3}` - Démarre un appel avec un serveur Discord aléatoire des [pages jaunes]({8})\n\
  `{4}` - Affiche le numéro de téléphone d'un serveur Discord (ID du serveur)\n\
  `{5}` - Une liste de contacts pour éviter de retaper le même numéro à chaque fois grâce à l'autocomplétion\n\
  `{6}` - Bloque certains serveurs pour qu'ils ne puissent pas t'appeler\n\
  `{7}` - Personnalise le bot pour ton serveur Discord
summary.privacy=Confidentialité
summary.terms-of-service=Conditions d'utilisation
summary.quick-setup=Utilise la "Configuration rapide" pour commencer le plus vite possible !

